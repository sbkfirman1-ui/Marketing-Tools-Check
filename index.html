                extend: {
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],

                        baksed: {
                            blue: '#2a70a8',    /* Biru background logo */

                            orange: '#c74a33',  /* Oranye mie/tulisan */

                            850: '#151e2e',

            transition: all 0.2s ease-in-out;
        }

            transition: width 0.5s ease-in-out, background-color 0.5s ease-in-out;

                                        <input type="file" id="upload_${item.id}" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoUpload('${item.id}', this)">
                                        <div class="flex flex-col items-center text-slate-400">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                                            <span class="text-[8px] font-bold text-center uppercase tracking-wider px-1">Ambil Foto</span>
                                        </div>
                                    </label>
                                    
                                    <div id="display_${item.id}" class="absolute inset-0 hidden rounded-xl overflow-hidden border border-slate-200 group bg-black">
                                        <img id="preview_${item.id}" src="" class="w-full h-full object-cover cursor-pointer opacity-90 hover:opacity-100 transition-opacity" onclick="openLightbox(this.src)">
                                        
                                        <div class="absolute top-1.5 right-1.5 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                            <label for="upload_${item.id}" class="bg-white/90 backdrop-blur-sm text-slate-700 rounded-md p-1 shadow-sm cursor-pointer hover:bg-white transition-colors" title="Ganti Foto">
                                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                                            </label>
                                            <button type="button" onclick="removePhoto('${item.id}', event)" class="bg-rose-500/90 backdrop-blur-sm text-white rounded-md p-1 shadow-sm cursor-pointer hover:bg-rose-600 transition-colors" title="Hapus Foto">
                                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                            </button>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                        
                        <div class="flex-1 w-full space-y-3">
                            <div>
                                <label class="block text-[10px] font-bold text-baksed-blue mb-1.5 uppercase tracking-wide">Ketersediaan Item</label>
                                <div class="flex gap-2 w-full">
                                    <div class="flex-1">
                                        <input type="radio" id="ket_ada_${item.id}" name="ket_${item.id}" value="Ada" class="peer hidden" onchange="toggleKondisi('${item.id}', true)">
                                        <label for="ket_ada_${item.id}" class="radio-label flex items-center justify-center w-full cursor-pointer px-3 py-2 border border-slate-200 rounded-xl peer-checked:border-baksed-blue peer-checked:bg-baksed-blue peer-checked:text-white hover:bg-slate-50 text-xs sm:text-sm font-bold text-slate-600">
                                            Tersedia
                                        </label>
                                    </div>
                                    <div class="flex-1">
                                        <input type="radio" id="ket_tdk_${item.id}" name="ket_${item.id}" value="Tidak Ada" class="peer hidden" onchange="toggleKondisi('${item.id}', false)">
                                        <label for="ket_tdk_${item.id}" class="radio-label flex items-center justify-center w-full cursor-pointer px-3 py-2 border border-slate-200 rounded-xl peer-checked:border-slate-400 peer-checked:bg-slate-100 peer-checked:text-slate-800 hover:bg-slate-50 text-xs sm:text-sm font-bold text-slate-600">
                                            Tidak Ada
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <!-- Pilihan Kondisi -->
                            <div id="kondisi_${item.id}" class="collapse-content border-t border-slate-100/0 mt-0">
                                <label class="block text-[10px] font-bold text-baksed-blue mb-1.5 uppercase tracking-wide">Kondisi Fisik Aktual</label>
                                <div class="flex gap-1.5 w-full">
                                    <div class="flex-1">
                                        <input type="radio" id="kon_bg_${item.id}" name="kon_${item.id}" value="Bagus" class="peer hidden" onchange="calculateScore()">
                                        <label for="kon_bg_${item.id}" class="radio-label flex items-center justify-center w-full cursor-pointer px-1 py-2 border border-slate-200 rounded-lg peer-checked:border-emerald-600 peer-checked:bg-emerald-50 peer-checked:text-emerald-700 hover:bg-slate-50 text-[10px] font-bold text-slate-500 text-center h-full">Sangat Baik</label>
                                    </div>
                                    <div class="flex-1">
                                        <input type="radio" id="kon_mb_${item.id}" name="kon_${item.id}" value="Masih Bagus" class="peer hidden" onchange="calculateScore()">
                                        <label for="kon_mb_${item.id}" class="radio-label flex items-center justify-center w-full cursor-pointer px-1 py-2 border border-slate-200 rounded-lg peer-checked:border-amber-500 peer-checked:bg-amber-50 peer-checked:text-amber-700 hover:bg-slate-50 text-[10px] font-bold text-slate-500 text-center h-full">Cukup</label>
                                    </div>
                                    <div class="flex-1">
                                        <input type="radio" id="kon_tb_${item.id}" name="kon_${item.id}" value="Tidak Bagus" class="peer hidden" onchange="calculateScore()">
                                        <label for="kon_tb_${item.id}" class="radio-label flex items-center justify-center w-full cursor-pointer px-1 py-2 border border-slate-200 rounded-lg peer-checked:border-rose-500 peer-checked:bg-rose-50 peer-checked:text-rose-700 hover:bg-slate-50 text-[10px] font-bold text-slate-500 text-center h-full">Rusak</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
            container.innerHTML = htmlContent;
        }

        // Handle Unggah Foto Aktual
        function handlePhotoUpload(itemId, input) {
            const file = input.files[0];
            if (file) {
                uploadedPhotos[itemId] = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const displayDiv = document.getElementById(`display_${itemId}`);
                    const labelDiv = document.getElementById(`label_${itemId}`);
                    const previewImg = document.getElementById(`preview_${itemId}`);
                    
                    previewImg.src = e.target.result;
                    displayDiv.classList.remove('hidden');
                    labelDiv.classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        // Hapus Foto Aktual
        function removePhoto(itemId, event) {
            event.preventDefault();
            event.stopPropagation();
            
            delete uploadedPhotos[itemId];
            const input = document.getElementById(`upload_${itemId}`);
            if(input) input.value = '';
            
            document.getElementById(`display_${itemId}`).classList.add('hidden');
            document.getElementById(`label_${itemId}`).classList.remove('hidden');
            document.getElementById(`preview_${itemId}`).src = '';
        }

        // Efek transisi runtuh/tampil area kondisi fisik
        function toggleKondisi(itemId, isAda) {
            const kondisiArea = document.getElementById(`kondisi_${itemId}`);
            const radioKondisi = document.querySelectorAll(`input[name="kon_${itemId}"]`);
            
            if (isAda) {
                kondisiArea.classList.add("active");
                kondisiArea.classList.add("border-slate-100", "pt-3");
            } else {
                kondisiArea.classList.remove("active", "border-slate-100", "pt-3");
                radioKondisi.forEach(radio => radio.checked = false);
            }
            calculateScore();
        }

        // Penghitungan Skor Persentase & Status secara Otomatis
        function filterChecklist() {
            const selectedOutlet = document.getElementById("outletName").value;
            
            checklistData.forEach(item => {
                const card = document.getElementById(`card_${item.id}`);
                if (!card) return;

                if (selectedOutlet && item.exceptions && item.exceptions.includes(selectedOutlet)) {
                    card.style.display = 'none'; // Sembunyikan jika outlet masuk pengecualian
                } else {
                    card.style.display = 'block'; // Tampilkan jika tidak
                }
            });
            
            calculateScore(); 
        }

        function calculateScore() {
            const selectedOutlet = document.getElementById("outletName").value;
            let totalChecked = 0;
            let scoreEarned = 0;
            
            checklistData.forEach(item => {
                // Jangan hitung item yang dikecualikan untuk outlet yang dipilih
                if (selectedOutlet && item.exceptions && item.exceptions.includes(selectedOutlet)) {
                    return;
                }

                const ketAda = document.getElementById(`ket_ada_${item.id}`);
                const ketTdk = document.getElementById(`ket_tdk_${item.id}`);
                
                const konBg = document.getElementById(`kon_bg_${item.id}`);
                const konMb = document.getElementById(`kon_mb_${item.id}`);
                const konTb = document.getElementById(`kon_tb_${item.id}`);
                
                if (ketTdk && ketTdk.checked) {
                    // Jika memilih "Tidak Ada", terhitung selesai diaudit, bernilai 0%
                    totalChecked++;
                } else if (ketAda && ketAda.checked) {
                    // Jika memilih "Tersedia", harus melengkapi pilihan kondisi fisiknya dahulu
                    if ((konBg && konBg.checked) || (konMb && konMb.checked) || (konTb && konTb.checked)) {
                        totalChecked++;
                        
                        // Menambahkan skor HANYA jika kondisinya Sangat Baik (Bagus) atau Cukup (Masih Bagus)
                        if ((konBg && konBg.checked) || (konMb && konMb.checked)) {
                            scoreEarned++;
                        }
                    }
                }
            });

            const scoreBar = document.getElementById('scoreBar');
            const scorePercentageText = document.getElementById('scorePercentage');
            const scoreStatusText = document.getElementById('scoreStatus');

            if (totalChecked === 0) {
                scorePercentageText.innerText = "0%";
                scoreStatusText.innerText = "Menunggu Input...";
                scoreStatusText.className = "text-xs sm:text-sm font-extrabold mt-1 text-slate-500";
                scoreBar.style.width = "0%";
                scoreBar.className = "bg-slate-300 h-2 rounded-full progress-bar-fill";
                currentPercentage = 0;
                currentStatus = "Belum Dinilai";
                return;
            }

            const percentage = Math.round((scoreEarned / totalChecked) * 100);
            currentPercentage = percentage;
            scoreBar.style.width = `${percentage}%`;
            scorePercentageText.innerText = `${percentage}%`;

            // Aturan Klasifikasi Skor Kelayakan
            if (percentage >= 80) {
                scoreStatusText.innerText = "Bagus (Layak)";
                scoreStatusText.className = "text-xs sm:text-sm font-extrabold mt-1 text-emerald-600";
                scoreBar.className = "bg-emerald-500 h-2 rounded-full progress-bar-fill";
                currentStatus = "Bagus";
            } else if (percentage >= 50) {
                scoreStatusText.innerText = "Tidak Terlalu Bagus";
                scoreStatusText.className = "text-xs sm:text-sm font-extrabold mt-1 text-amber-500";
                scoreBar.className = "bg-amber-500 h-2 rounded-full progress-bar-fill";
                currentStatus = "Tidak Terlalu Bagus";
            } else {
                scoreStatusText.innerText = "Tidak Bagus (Perlu Perbaikan)";
                scoreStatusText.className = "text-xs sm:text-sm font-extrabold mt-1 text-rose-500";
                scoreBar.className = "bg-[#c74a33] h-2 rounded-full progress-bar-fill";
                currentStatus = "Tidak Bagus";
            }
        }

        // Lightbox Modal functions
        function openLightbox(src) {
            if(!src) return;
            const lb = document.getElementById("lightbox");
            const img = document.getElementById("lightboxImg");
            img.src = src;
            lb.classList.remove("hidden");
            lb.classList.add("flex");
            setTimeout(() => {
                lb.classList.remove("opacity-0");
                img.classList.remove("scale-95");
                img.classList.add("scale-100");
            }, 10);
        }

        function closeLightbox() {
            const lb = document.getElementById("lightbox");
            const img = document.getElementById("lightboxImg");
            lb.classList.add("opacity-0");
            img.classList.remove("scale-100");
            img.classList.add("scale-95");
            setTimeout(() => {
                lb.classList.remove("flex");
                lb.classList.add("hidden");
            }, 300);
        }

        // Modals Management
        function showAlert(msg) {
            const modal = document.getElementById('alertModal');
            const content = document.getElementById('alertModalContent');
            document.getElementById('alertMessage').innerText = msg;
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);
        }

        function closeAlert() {
            const modal = document.getElementById('alertModal');
            const content = document.getElementById('alertModalContent');
            
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }, 300);
        }

        function confirmReset() {
            const modal = document.getElementById('confirmModal');
            const content = document.getElementById('confirmModalContent');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);
        }

        function closeConfirm() {
            const modal = document.getElementById('confirmModal');
            const content = document.getElementById('confirmModalContent');
            
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }, 300);
        }

        // Pemrosesan Data & Unduh Laporan (Berubah dari CSV ke Excel HTML-based)
        function exportData() {
            const auditor = document.getElementById("auditorName").value.trim();
            const outlet = document.getElementById("outletName").value;
            const auditDate = document.getElementById("auditDate").value;

            if (!auditor || !outlet || !auditDate) {
                showAlert("Harap isi Nama Auditor, Lokasi Outlet, dan Tanggal Audit terlebih dahulu.");
                return;
            }

            const now = new Date();
            const exportTimestamp = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            
            const [year, month, day] = auditDate.split('-');
            const formattedDate = `${day}/${month}/${year}`;

            // Membuat struktur tabel HTML yang bisa dibaca dan dikonversi otomatis oleh Excel / WPS
            let excelContent = `
            <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
            <head>
                <meta charset="utf-8">
                <style>
                    table { border-collapse: collapse; font-family: sans-serif; }
                    th, td { border: 1px solid #000000; padding: 10px; text-align: left; vertical-align: middle; }
                    th { background-color: #2a70a8; color: #ffffff; font-weight: bold; text-align: center; }
                    .summary td { border: none; padding: 5px; font-weight: bold; }
                    /* Menambahkan styling khusus untuk sel foto agar rapi */
                    .foto-cell { text-align: center; vertical-align: middle; width: 160px; height: 160px; padding: 5px; }
                </style>
            </head>
            <body>
                <table class="summary">
                    <tr><td>TANGGAL AUDIT</td><td>: ${formattedDate}</td></tr>
                    <tr><td>WAKTU EXPORT</td><td>: ${exportTimestamp}</td></tr>
                    <tr><td>NAMA AUDITOR</td><td>: ${auditor}</td></tr>
                    <tr><td>OUTLET BAKSED</td><td>: ${outlet}</td></tr>
                    <tr><td>PERSENTASE KELAYAKAN</td><td>: ${currentPercentage}%</td></tr>
                    <tr><td>STATUS KELAYAKAN</td><td>: ${currentStatus}</td></tr>
                </table>
                <br>
                <table>
                    <tr>
                        <!-- Memberikan lebar kolom default agar tampilan spreadsheet lebih profesional -->
                        <th style="width: 150px;">Kategori Item</th>
                        <th style="width: 200px;">Nama Item</th>
                        <th style="width: 120px;">Keterangan</th>
                        <th style="width: 150px;">Kondisi</th>
                        <th style="width: 170px;">Foto Aktual</th>
                    </tr>`;

            checklistData.forEach(item => {
                // Abaikan item yang dikecualikan agar tidak masuk ke laporan Excel
                if (item.exceptions && item.exceptions.includes(outlet)) {
                    return; 
                }

                const ketEl = document.querySelector(`input[name="ket_${item.id}"]:checked`);
                const konEl = document.querySelector(`input[name="kon_${item.id}"]:checked`);
                
                const keterangan = ketEl ? ketEl.value : "-";
                let kondisi = "-";
                
                if (keterangan === "Ada" && konEl) {
                    kondisi = konEl.value;
                }

                // Menyisipkan gambar langsung ke dalam sel tabel jika ada
                let fotoHtml = "Tidak Ada";
                if (uploadedPhotos[item.id]) {
                    const previewImg = document.getElementById(`preview_${item.id}`);
                    // Memaksa dimensi gambar 150x150 agar baris tabel seragam dan tidak berantakan
                    fotoHtml = `<img src="${previewImg.src}" width="150" height="150" style="object-fit: cover;">`; 
                }

                const baris = `
                    <tr>
                        <td>${item.kategori}</td>
                        <td>${item.nama}</td>
                        <td>${keterangan}</td>
                        <td>${kondisi}</td>
                        <td class="foto-cell">${fotoHtml}</td>
                    </tr>`;
                excelContent += baris;
            });

            excelContent += `
                </table>
            </body>
            </html>`;

            // Proses penyimpanan sebagai file .xls
            const blob = new Blob([excelContent], { type: 'application/vnd.ms-excel' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `Audit_Baksed_${outlet.replace(/\s/g, "")}_${now.getTime()}.xls`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Eksekusi Reset Form secara menyeluruh
        function executeReset() {
            document.getElementById("auditorName").value = "";
            document.getElementById("outletName").value = "";
            
            const auditDateInput = document.getElementById("auditDate");
            auditDateInput.value = "";
            auditDateInput.type = "text";
            
            checklistData.forEach(item => {
                const kondisiArea = document.getElementById(`kondisi_${item.id}`);
                if (kondisiArea) {
                    kondisiArea.classList.remove("active", "border-slate-100", "pt-3");
                }
                
                const input = document.getElementById(`upload_${item.id}`);
                if(input) {
                    input.value = '';
                    document.getElementById(`display_${item.id}`).classList.add('hidden');
                    document.getElementById(`label_${item.id}`).classList.remove('hidden');
                    document.getElementById(`preview_${item.id}`).src = '';
                }
            });

            for (let key in uploadedPhotos) delete uploadedPhotos[key];

            const radios = document.querySelectorAll('input[type="radio"]');
            radios.forEach(radio => radio.checked = false);
            
            filterChecklist(); // Memastikan pengecualian item diterapkan sesuai pilihan dropdown baru
            calculateScore();
            closeConfirm();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = function() {
            renderChecklist();
            filterChecklist(); // Atur tampilan pengecualian awal
            calculateScore();
        };
    </script>
</body>
